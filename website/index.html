<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <!-- `interactive-widget=resizes-content`: the default, `resizes-visual`, shrinks only
       the VISUAL viewport when the software keyboard opens. The layout viewport keeps
       its full height, so `vh`, `dvh` and `position:fixed; inset:0` all keep laying out
       against a window the user can no longer see the bottom of -- a focused full-screen
       overlay strands its own content below the keyboard with no gesture to reach it.
       `resizes-content` resizes the layout viewport instead, so the shell (already
       `h-dvh` with `overflow-hidden` and inner `min-h-0` scrollers) simply gets shorter
       and the focused input stays on screen. `dvh` alone cannot do this: it tracks
       collapsible browser UI, not the keyboard. -->
  <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report
       non-zero values on notched iPhones (Safari and the standalone PWA).
       Screen-edge surfaces then inset themselves with the tailwindcss-safe-area
       utilities; src/test/safeArea.guard.test.ts enforces that. -->
  <!-- `maximum-scale=1, user-scalable=no`: the dashboard is an application shell, not a
       zoomable document, and a pinch magnifies a `position: fixed` / `h-dvh` shell that
       has no scroll axis to reach what the magnification pushed off-screen.
       These two keys are ONE of three mechanisms and cover only Blink and Gecko: WebKit
       ignores them for user gestures, so iOS needs the `gesturestart` suppression in
       utils/pageZoom.ts plus the root `touch-action` in index.css. Removing any one of
       the three silently un-covers an engine.
       Rationale, the accessibility trade and what still magnifies: the policy section
       in website/docs/page-layout.md is the authoritative copy — extend it there, not
       here. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/logo.png" type="image/png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0e13" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <!-- Overpass and Overpass Mono are bundled (see the @font-face block in
       src/index.css), so the dashboard makes no font request off this host.
       Preloading the Latin files starts them with the HTML instead of after
       the stylesheet parses, which keeps the first paint from reflowing when
       the faces swap in. Other scripts load on demand through unicode-range. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/overpass/overpass-latin-wght-normal.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/overpass/overpass-mono-latin-wght-normal.woff2" crossorigin />
  <title>Warding</title>
  <script>
    // Set data-ui from localStorage before React hydrates to prevent flash of
    // chat layout when the user's preferred mode is 'cli'. Mirrors the
    // pattern used by data-theme bootstrapping. Synced by useUIMode.
    try { var u = localStorage.getItem('mc-ui'); if (u === 'cli') document.documentElement.dataset.ui = 'cli'; } catch (e) {}
    // Set <html lang> from the cached language choice before React hydrates, so
    // assistive tech and :lang() CSS see the right language on the first paint
    // rather than 'en' briefly. Only the shape is validated here — the real
    // resolution (browser detection, fallback) happens in src/i18n/detect.ts;
    // this is a pre-hydration hint, not the source of truth. Synced by
    // useLanguage.
    try {
      var l = localStorage.getItem('mc-lang');
      if (l && /^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8}){0,2}$/.test(l)) document.documentElement.lang = l;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js')</script>
</body>
</html>
